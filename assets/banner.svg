<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Alacrity</title>
  <desc id="d">Alacrity. Machine speed, human decision. AI on the systems you already run.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f10"/>
      <stop offset="1" stop-color="#151819"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="1280" height="360" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- wordmark + headline -->
  <text x="72" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="6" fill="#ffffff" fill-opacity="0.6">ALACRITY</text>
  <text x="70" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#f4f5f2">Machine speed,</text>
  <text x="70" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#b6f0d3">human decision.</text>
  <text x="72" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#ffffff" fill-opacity="0.85">AI on the systems you already run.</text>
  <text x="72" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#ffffff" fill-opacity="0.45">AI ENGINEERING, MADE FOR THE REAL WORLD</text>

  <!-- flow: your systems -> intelligence layer -> human decision -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <g transform="translate(776 96)">
      <rect width="136" height="150" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.28"/>
      <text x="16" y="30" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#ffffff" fill-opacity="0.7">YOUR SYSTEMS</text>
      <g font-size="13" fill="#ffffff" fill-opacity="0.8">
        <text x="16" y="66">Data</text>
        <text x="16" y="92">Software</text>
        <text x="16" y="118">Workflows</text>
      </g>
    </g>
    <line x1="920" y1="171" x2="952" y2="171" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(960 96)">
      <rect width="136" height="150" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.5"/>
      <text x="16" y="30" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#ffffff" fill-opacity="0.9">INTELLIGENCE</text>
      <g font-size="13" fill="#ffffff" fill-opacity="0.85">
        <text x="16" y="66">Connect</text>
        <text x="16" y="92">Analyze</text>
        <text x="16" y="118">Coordinate</text>
      </g>
    </g>
    <line x1="1104" y1="171" x2="1136" y2="171" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(1144 96)">
      <rect width="96" height="150" rx="10" fill="#b6f0d3" fill-opacity="0.10" stroke="#b6f0d3" stroke-opacity="0.85"/>
      <text x="14" y="30" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#b6f0d3">HUMAN</text>
      <circle cx="48" cy="88" r="20" fill="none" stroke="#b6f0d3" stroke-width="2"/>
      <path d="M38 88 L45 95 L59 80" fill="none" stroke="#b6f0d3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="14" y="132" font-size="11" fill="#b6f0d3" fill-opacity="0.9">decides</text>
    </g>
    <text x="776" y="278" font-size="11.5" letter-spacing="1.6" fill="#ffffff" fill-opacity="0.45">BUILT ON WHAT WORKS  ·  EVERY STEP VISIBLE</text>
  </g>
</svg>
